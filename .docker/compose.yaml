# =============================================================================
# Docker Compose - Preço Certo
# =============================================================================
# Para desenvolver: docker compose -f .docker/compose.yaml up
# Para parar: Ctrl+C ou docker compose down
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # DATABASE - PostgreSQL para desenvolvimento local
  # ---------------------------------------------------------------------------
  database:
    build:
      context: ../
      dockerfile: .docker/Dockerfile.postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=sem_susto
      - APP_ENV=local

  # ---------------------------------------------------------------------------
  # backend - Python Worker para scripts pesados (Data Engineering)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ../
      dockerfile: .docker/Dockerfile.python
    volumes:
      - ../:/app
    working_dir: /app
    environment:
      - APP_ENV=local
      - DATABASE_URL=postgresql://postgres:postgres@database:5432/sem_susto
      - INIT_DB_IMPORTAR_DADOS=true
      - INIT_DB_RESETAR_BANCO=false
    # Mantém o container vivo para rodarmos comandos manuais ou roda o script direto
    command: tail -f /dev/null

  # ---------------------------------------------------------------------------
  # APP - Node.js com Vite (Build via Dockerfile)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: ../
      dockerfile: .docker/Dockerfile.node
      target: dev
    ports:
      - '5173:5173' # Frontend / Vite
      - '3000:3000' # Backend / API Local (Express)
    volumes:
      - ../:/app
      - /app/node_modules
    working_dir: /app
    stdin_open: true
    tty: true
    environment:
      - APP_ENV=local
      - VITE_APP_ENV=local
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@database:5432/sem_susto
      - VITE_USAR_BANCO_POSTGRES=true
      - WATCHPACK_POLLING=true
      - HOST_IP=${HOST_IP:-}
    env_file:
      - ../.env
    depends_on:
      - database

volumes:
  postgres-data:

